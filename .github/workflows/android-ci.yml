name: Android CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "agent/**"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-build:
    name: Native Android builds
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            build.gradle
            settings.gradle
            gradle.properties
            apps/01-openxr-bootstrap/build.gradle
            apps/02-vulkan-stereo-triangle/build.gradle
            apps/03-head-pose/build.gradle
            apps/04-controller-input/build.gradle
            apps/05-passthrough/build.gradle
            apps/06-spatial-object/build.gradle
            apps/07-hand-tracking/build.gradle
            XrPassthrough/Projects/Android/build.gradle
            XrPassthrough/Projects/Android/gradle/wrapper/gradle-wrapper.properties

      - name: Select canonical toolchain roots
        run: |
          echo "QUEST_ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "QUEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Check shell scripts
        run: |
          shellcheck \
            scripts/setup_quest_dev_env.sh \
            scripts/print_toolchain_config.sh \
            scripts/build_deploy.sh \
            scripts/toolchain_config.sh

      - name: Install pinned Android toolchain
        run: |
          source scripts/toolchain_config.sh
          quest_export_toolchain
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-$QUEST_COMPILE_SDK" \
            "build-tools;$QUEST_BUILD_TOOLS_VERSION" \
            "cmake;$QUEST_CMAKE_VERSION" \
            "ndk;$QUEST_NDK_VERSION"

      - name: Verify pinned toolchain
        run: ./scripts/print_toolchain_config.sh --strict

      - name: Test XR math
        run: |
          cmake -S libs/xr_math -B build/xr-math-tests -DBUILD_TESTING=ON
          cmake --build build/xr-math-tests --parallel
          ctest --test-dir build/xr-math-tests --output-on-failure

      - name: Test XR interaction
        run: |
          cmake -S libs/xr_interaction -B build/xr-interaction-tests -DBUILD_TESTING=ON
          cmake --build build/xr-interaction-tests --parallel
          ctest --test-dir build/xr-interaction-tests --output-on-failure

      - name: Build OpenXR bootstrap
        run: ./scripts/build_deploy.sh --app 01-openxr-bootstrap --build-only

      - name: Build Vulkan stereo triangle
        run: ./scripts/build_deploy.sh --app 02-vulkan-stereo-triangle --build-only

      - name: Build head pose and coordinate spaces
        run: ./scripts/build_deploy.sh --app 03-head-pose --build-only

      - name: Build controller input and interaction
        run: ./scripts/build_deploy.sh --app 04-controller-input --build-only

      - name: Build passthrough mixed reality
        run: ./scripts/build_deploy.sh --app 05-passthrough --build-only

      - name: Build stable spatial object
        run: ./scripts/build_deploy.sh --app 06-spatial-object --build-only

      - name: Build hand tracking and pinch interaction
        run: ./scripts/build_deploy.sh --app 07-hand-tracking --build-only

      - name: Build legacy passthrough regression
        run: ./scripts/build_deploy.sh --app xrpassthrough --build-only

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apks
          path: |
            apps/01-openxr-bootstrap/build/outputs/apk/debug/01-openxr-bootstrap-debug.apk
            apps/02-vulkan-stereo-triangle/build/outputs/apk/debug/02-vulkan-stereo-triangle-debug.apk
            apps/03-head-pose/build/outputs/apk/debug/03-head-pose-debug.apk
            apps/04-controller-input/build/outputs/apk/debug/04-controller-input-debug.apk
            apps/05-passthrough/build/outputs/apk/debug/05-passthrough-debug.apk
            apps/06-spatial-object/build/outputs/apk/debug/06-spatial-object-debug.apk
            apps/07-hand-tracking/build/outputs/apk/debug/07-hand-tracking-debug.apk
            XrPassthrough/Projects/Android/build/outputs/apk/debug/XrPassthrough-debug.apk
          if-no-files-found: error
          retention-days: 14
