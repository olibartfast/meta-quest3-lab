plugins {
    id "com.android.application"
}

def validationEnabled =
    providers.gradleProperty("questVulkanValidation")
        .orElse("false")
        .get()
        .toBoolean()

android {
    namespace "com.olibartfast.questlab.spatialanchors"
    compileSdk 34
    buildToolsVersion "34.0.0"
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.olibartfast.questlab.spatialanchors"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments(
                    "-DANDROID_STL=c++_static",
                    "-DQUEST_ENABLE_VULKAN_VALIDATION=" +
                        (validationEnabled ? "ON" : "OFF")
                )
                cppFlags "-std=c++17", "-Wall", "-Wextra", "-Wpedantic"
                targets "spatial_anchors"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    externalNativeBuild {
        cmake {
            path file("CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation "org.khronos.openxr:openxr_loader_for_android:1.1.51"
}
